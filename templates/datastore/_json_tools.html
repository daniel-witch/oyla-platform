{% load i18n %}
<script>
(function () {
  var box = document.getElementById("json-box");
  var msg = document.getElementById("check-msg");
  if (!box) return;

  function lineCol(text, pos) {
    var before = text.slice(0, pos).split("\n");
    return { line: before.length, col: before[before.length - 1].length + 1 };
  }
  function lineStart(text, line) {
    var idx = 0;
    for (var i = 1; i < line; i++) { idx = text.indexOf("\n", idx) + 1; }
    return idx;
  }
  function show(text, ok) {
    msg.textContent = text;
    msg.className = "check-msg " + (ok ? "good" : "bad");
    box.classList.remove("good", "bad");
    box.classList.add(ok ? "good" : "bad");
  }
  function check() {
    var text = box.value;
    if (!text.trim()) { show("{% translate 'The box is empty. Paste some JSON first, or press “Load example”.' %}", false); return null; }
    try {
      var data = JSON.parse(text);
      if (data === null || typeof data !== "object") {
        show("{% translate 'Your JSON must start with { or [.' %}", false); return null;
      }
      show("✓ {% translate 'Looks good! Your JSON is valid.' %}", true);
      return data;
    } catch (e) {
      var m = String(e.message), line = null, col = null, pos = null;
      var mp = m.match(/position (\d+)/);
      var ml = m.match(/line (\d+) column (\d+)/);
      if (ml) { line = +ml[1]; col = +ml[2]; pos = lineStart(text, line) + col - 1; }
      else if (mp) { pos = +mp[1]; var lc = lineCol(text, pos); line = lc.line; col = lc.col; }
      var hint = "{% translate 'Something is wrong here. Check for a missing comma, quote or bracket.' %}";
      if (/Unexpected end|end of data|Unterminated/i.test(m)) hint = "{% translate 'Your JSON ends too early - is a closing } ] or \" missing?' %}";
      else if (/property name|double-quoted/i.test(m)) hint = "{% translate 'Names must be in double quotes, like \"name\". Also check for an extra comma before }.' %}";
      else if (/after array element|after property value|Expected ','/i.test(m)) hint = "{% translate 'You are probably missing a comma (,) just before this point.' %}";
      else if (/Bad control character|control character/i.test(m)) hint = "{% translate 'Text inside quotes cannot go onto a new line.' %}";
      show((line ? "{% translate 'Line' %} " + line + ", {% translate 'column' %} " + col + ": " : "") + hint, false);
      if (pos !== null) { box.focus(); box.setSelectionRange(Math.max(pos - 1, 0), Math.min(pos + 1, text.length)); }
      return null;
    }
  }
  var c = document.getElementById("btn-check");
  var n = document.getElementById("btn-format");
  var ex = document.getElementById("btn-example");
  if (c) c.addEventListener("click", check);
  if (n) n.addEventListener("click", function () {
    var data = check();
    if (data !== null) { box.value = JSON.stringify(data, null, 2); show("✓ {% translate 'Tidied up!' %}", true); }
  });
  if (ex) ex.addEventListener("click", function () {
    box.value = document.getElementById("example-json").textContent;
    check();
  });
  // Jump to the server-side error line, if any.
  var errLine = box.getAttribute("data-error-line");
  if (errLine) {
    var s = lineStart(box.value, +errLine);
    var e = box.value.indexOf("\n", s); if (e < 0) e = box.value.length;
    box.classList.add("bad"); box.focus(); box.setSelectionRange(s, e);
  }
})();
</script>
