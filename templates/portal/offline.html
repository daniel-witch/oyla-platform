<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>You're offline — Oyla</title>
{% include "portal/_app_head.html" %}
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f6f7fb;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1a1f2b; padding: 24px; box-sizing: border-box; }
  .box { background: #fff; border: 1px solid #e5e8ee; border-radius: 18px; padding: 32px 26px; max-width: 380px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { color: #6b7280; font-size: 15.5px; line-height: 1.55; margin: 0 0 20px; }
  button { font-weight: 700; font-size: 16px; font-family: inherit; background: #1a56db; color: #fff; border: 0; border-radius: 12px; padding: 13px 22px; cursor: pointer; min-height: 48px; }
</style>
</head>
<body>
  <div class="box">
    <img src="/static/portal/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Oyla needs the internet to load your lessons and save your progress. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
