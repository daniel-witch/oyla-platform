<!DOCTYPE html>
<html>
<head><title>Change password</title></head>
<body style="font-family: sans-serif; max-width: 400px; margin: 60px auto;">
  <h2>Change your password</h2>
  {% if form.errors %}
    <ul style="color: red;">
      {% for field in form %}{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}{% endfor %}
    </ul>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label>Current password<br><input type="password" name="old_password" required></label></p>
    <p><label>New password<br><input type="password" name="new_password1" required></label></p>
    <p><label>Confirm new password<br><input type="password" name="new_password2" required></label></p>
    <button type="submit">Change password</button>
  </form>
  <p><a href="/">Back to dashboard</a></p>
</body>
</html>
