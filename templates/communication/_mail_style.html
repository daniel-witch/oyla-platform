<style>
  .mail-tabs { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .mail-tabs .btn-primary { padding: 9px 14px; font-size: 13px; }
  .mail-tabs .mt { padding: 8px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .mail-tabs .mt.on { background: #fff; color: var(--navy); border: 1px solid var(--border); }
  .mail-row { display: grid; grid-template-columns: 200px 1fr 120px; gap: 14px; padding: 12px 14px; border-bottom: 1px solid var(--border); align-items: center; font-size: 14px; }
  .mail-row:hover { background: #f7f9fd; }
  .mail-row.unread { font-weight: 700; background: #f4f8ff; }
  .mail-row .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail-row .subj { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail-row .subj span { color: var(--muted); font-weight: 400; }
  .mail-row .when { font-size: 12px; color: var(--muted); text-align: right; font-weight: 500; }
  .mail-search { display: flex; gap: 8px; margin-left: auto; }
  .mail-search input { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  @media (max-width: 760px) { .mail-row { grid-template-columns: 1fr auto; } .mail-row .subj { grid-column: 1 / -1; } .mail-search { margin-left: 0; width: 100%; } .mail-search input { flex: 1; } }
</style>
